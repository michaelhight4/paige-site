name: Kilumen asset grid-fit check
# Quality standard for every Kilumen asset: collision = opaque pixels snapped to 64px squares,
# map collision matches furniture art (doors/stairs/water/ledges untouched). Fails if any asset or map drifts.
# grid_fit_world (v0.2.65): same rule for EVERY map incl. outdoor (trees, rocks, buildings, roofs/canopies never block)
# + reachability test that walks every map's warps.
on:
  push:
    paths: ['kilumen/art/**', 'kilumen/tools/furniture/**', 'kilumen/tools/gridfit_world/**', 'kilumen/tests/grid_fit_world_reach.test.mjs', '.github/workflows/kilumen-asset-grid-fit.yml']
  pull_request:
    paths: ['kilumen/art/**', 'kilumen/tools/furniture/**', 'kilumen/tools/gridfit_world/**', 'kilumen/tests/grid_fit_world_reach.test.mjs', '.github/workflows/kilumen-asset-grid-fit.yml']
  workflow_dispatch:
jobs:
  grid-fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kilumen/art/world/overworld
            kilumen/tools
            kilumen/tests
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pillow
      - run: python kilumen/tools/furniture/grid_fit_and_swap.py kilumen --check --overworld --report /tmp/grid_fit_report.md
      - run: python kilumen/tools/gridfit_world/grid_fit_world.py kilumen --check --report /tmp/grid_fit_world_report.md
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test kilumen/tests/grid_fit_world_reach.test.mjs
      - if: always()
        run: cat /tmp/grid_fit_report.md /tmp/grid_fit_world_report.md || true
