<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96" role="img" aria-label="Boundwake pennant">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF4E4"/>
      <stop offset="55%" stop-color="#F4E6C8"/>
      <stop offset="100%" stop-color="#EBD7B0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0B14A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E0B14A"/>
      <stop offset="100%" stop-color="#E0B14A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- pole nub -->
  <rect x="28" y="0" width="8" height="6" rx="1.5" fill="#B07D24"/>
  <!-- pennant body -->
  <path d="M8 6 H56 V70 L32 92 L8 70 Z" fill="url(#p)" stroke="#E0B14A" stroke-width="1.5"/>
  <!-- gold trim hairline -->
  <path d="M12 10 H52" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
  <!-- simple crest diamond (original, no IP) -->
  <path d="M32 28 L40 40 L32 52 L24 40 Z" fill="none" stroke="#2A2118" stroke-width="1.4" opacity="0.55"/>
  <circle cx="32" cy="40" r="3.2" fill="#E0B14A" opacity="0.85"/>
</svg>
