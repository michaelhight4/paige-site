<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heldpath — Walk &amp; Run Tracker</title>
  <meta name="description" content="Heldpath is a free walk and run tracker from Paige Games. Coming soon to Google Play.">
  <link rel="canonical" href="https://paigegames.net/heldpath/">
  <style>
    :root {
      --bg: #12161c;
      --bg-2: #1a2028;
      --ink: #e8eef3;
      --muted: #8a9aa8;
      --blue: #4fa3c8;
      --blue-deep: #2b6f8a;
      --line: #2a333d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(900px 480px at 80% -10%, rgba(79,163,200,.16), transparent 60%),
        radial-gradient(700px 400px at -10% 110%, rgba(43,111,138,.18), transparent 55%),
        var(--bg);
      color: var(--ink);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 16vh 24px 48px;
    }
    .mark {
      width: 44px;
      height: 44px;
      margin-bottom: 22px;
      color: var(--blue);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(40px, 9vw, 64px);
      font-weight: 750;
      letter-spacing: -0.035em;
      line-height: 1;
    }
    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: clamp(18px, 3.4vw, 22px);
      max-width: 26ch;
    }
    .soon {
      display: inline-block;
      margin: 0 0 28px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--blue);
      background: var(--bg-2);
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    a { color: var(--blue); }
    a:hover { color: #8ec9e0; }
    .links { margin: 0; font-size: 15px; }
    .links a { text-decoration: none; border-bottom: 1px solid rgba(79,163,200,.4); }
    footer {
      padding: 0 24px 32px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <circle cx="22" cy="16" r="2.4" fill="currentColor"/>
      <path d="M22 24v14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <h1>Heldpath</h1>
    <p class="lead">Free walk &amp; run tracker, coming soon to Google Play.</p>
    <p class="soon">Coming soon to Google Play</p>
    <p class="links"><a href="privacy/">Privacy Policy</a></p>
  </main>
  <footer>
    <p>A product of <a href="/">Paige Games</a></p>
  </footer>
</body>
</html>
