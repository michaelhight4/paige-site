<body>
  <main><canvas id="world" aria-label="Kilumen overworld"></canvas></main>
  <!-- Cold-load fix (Oct 30, 2026): the world + title only paint once every tile sheet of the zoom set (~12 MB cold) is in,
       so a first visit on a slow link was a black page for 30 s+. This plain-HTML screen paints at once, and main.js removes it
       (window.__kboot.done) when the title mounts, or shows the error with a Reload button (window.__kboot.fail). -->
  <div id="kboot" role="status" aria-live="polite" style="position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0d1a;color:#e9e6ff;font:600 18px/1.3 system-ui,sans-serif;transition:opacity .3s">
    <div style="font-size:30px;letter-spacing:.08em">KILUMEN</div>
    <div id="kboot-msg">Loading the world…</div>
    <div style="width:min(260px,60vw);height:6px;border-radius:3px;background:#262a44;overflow:hidden"><div id="kboot-bar" style="height:100%;width:4%;background:#8f7cff;transition:width .4s"></div></div>
    <button id="kboot-reload" type="button" hidden style="font:inherit;padding:8px 18px;border-radius:8px;border:0;background:#8f7cff;color:#0b0d1a;cursor:pointer">Reload</button>
  </div>
  <script>
  (function () { // tiny boot screen; progress = resources fetched so far (a cold boot fetches ~220 before the title)
    var el = document.getElementById('kboot'), bar = document.getElementById('kboot-bar'), n = 0, over = false, po = null;
    try { po = new PerformanceObserver(function (l) { n += l.getEntries().length; if (!over) bar.style.width = Math.min(92, 4 + n * 0.4) + '%'; }); po.observe({ type: 'resource', buffered: true }); } catch (e) { /* old browser: bar stays put */ }
    function end() { over = true; if (po) po.disconnect(); }
    window.__kboot = {
      done: function () { if (over && !el.isConnected) return; end(); bar.style.width = '100%'; el.style.opacity = '0'; el.style.pointerEvents = 'none'; setTimeout(function () { el.remove(); }, 350); },
      fail: function (msg) { if (!el.isConnected) return; end(); document.getElementById('kboot-msg').textContent = 'Kilumen could not load' + (msg ? ': ' + msg : '') + '.'; var b = document.getElementById('kboot-reload'); b.hidden = false; b.onclick = function () { location.reload(); }; }
    };
  })();
  </script>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="touchpad" hidden>
    <div class="dpad">
      <button data-dir="up" aria-label="Up">&#9650;</button>
      <button data-dir="left" aria-label="Left">&#9664;</button>
      <button data-dir="right" aria-label="Right">&#9654;</button>
      <button data-dir="down" aria-label="Down">&#9660;</button>
    </div>
    <div class="btns">
      <button data-btn="debug" class="small" aria-label="Toggle debug overlay" hidden tabindex="-1">DBG</button>
      <button data-btn="select" class="small" aria-label="Bike on or off">SEL</button>
      <button data-btn="b" aria-label="B (hold to run)">B</button>
      <button data-btn="a" aria-label="A">A</button>
    </div>
  </div>
  <div id="rotate" role="alert" aria-hidden="true">
    <div class="rot-phone" aria-hidden="true"></div>
    <p>Turn your phone sideways to play</p>
    <p class="rot-sub">Kilumen plays in landscape only.</p>
  </div>
  <script type="module" src="src/landscape.js?v=v0.2.102-alpha"></script>
  <script type="module" src="src/fullscreen.js?v=v0.2.102-alpha"></script>

<script type="module" src="/playtime.js?game=kilumen&v=v0.2.102-alpha"></script>
  <script>/* offline play (Oct 30 2026): Workbox service worker, scope /kilumen/ (tools/sw/build_sw.mjs); ?sw=0 skips it */
    if ('serviceWorker' in navigator && !/[?&]sw=0\b/.test(location.search)) addEventListener('load', () => navigator.serviceWorker.register('sw.js', { scope: './' }).then(() => navigator.serviceWorker.ready).then(() => {
      // art/audio fetched before the worker took control on the first visit: copy them into this build's runtime cache too
      const v = (document.querySelector('link[rel=icon]')?.href.match(/[?&]v=([\w.-]+)/) || [])[1] || 'dev';
      const urls = performance.getEntriesByType('resource').map((e) => e.name).filter((u) => u.startsWith(location.origin) && /\/(art|audio|assets)\//.test(new URL(u).pathname));
      return caches.open('kilumen-rt-' + v).then((c) => Promise.all(urls.map((u) => c.match(u, { ignoreSearch: true }).then((hit) => hit || c.add(u).catch(() => {})))));
    }).catch(() => {}));</script>
</body>
