<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Within Shop | Paige Games</title>
<meta name="description" content="Lift Within apparel. Camo and Signature collections. Philippians 4:13.">
<meta name="theme-color" content="#1d2117">
<link rel="icon" href="img/banner-logo.webp">
<style>
:root{--gold:#d4a72c;--gold2:#f0c75a;--ink:#f4f1e8;--bg:#15180f;--panel:#20241a;--line:#3a3f2e;--mut:#b9b49f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:linear-gradient(rgba(21,24,15,.9),rgba(21,24,15,.94)),url(img/tile-a.webp) 0 0/420px repeat}
a{color:var(--gold2)}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(18,20,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top img{width:36px;height:36px;border-radius:8px;object-fit:cover;object-position:50% 30%}
header.top .brand{font-weight:800;letter-spacing:.12em;font-size:15px}
header.top .brand small{display:block;color:var(--gold);font-weight:600;letter-spacing:.08em;font-size:11px}
.cartbtn{margin-left:auto;position:relative;background:var(--gold);color:#1a1a10;border:0;border-radius:999px;padding:9px 16px;font-weight:800;font-size:15px;cursor:pointer}
.cartbtn .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:#1a1a10;color:var(--gold2);font-size:13px;line-height:20px;text-align:center}
.hero{position:relative;overflow:hidden;border-bottom:3px solid var(--gold);background:linear-gradient(rgba(10,12,6,.55),rgba(10,12,6,.7)),url(img/tile-a.webp) center/360px}
.hero .inner{display:flex;align-items:center;justify-content:center;gap:24px;max-width:1100px;margin:0 auto;padding:22px 16px}
.hero img.logo{width:min(46vw,260px);height:auto;aspect-ratio:780/720;object-fit:cover;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.hero .copy{max-width:420px;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.hero h1{margin:0;font-size:clamp(28px,6vw,54px);letter-spacing:.1em;line-height:1;color:#fff}
.hero .verse{color:var(--gold2);font-weight:800;letter-spacing:.18em;margin:10px 0 6px;font-size:14px}
.hero p{margin:6px 0 0;color:#e8e4d4;font-size:15px}
@media(max-width:560px){.hero .inner{flex-direction:column;text-align:center;gap:12px;padding:16px}.hero img.logo{width:150px}.hero h1{font-size:34px}.hero .verse{margin:6px 0 4px}}
.hero .ship{display:inline-block;margin-top:12px;background:rgba(0,0,0,.55);border:1px solid var(--gold);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--gold2)}
.testbar{background:#5a3b00;color:#ffe9b0;text-align:center;font-size:12px;padding:5px 10px;font-weight:700;letter-spacing:.04em}
main{max-width:1180px;margin:0 auto;padding:6px 14px 80px}
nav.jump{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
nav.jump::-webkit-scrollbar{display:none}
nav.jump a{flex:none;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600}
section{margin-top:26px;scroll-margin-top:70px}
section h2{margin:0 0 12px;font-size:20px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
section h2::before{content:"";width:6px;height:22px;background:var(--gold);border-radius:3px}
section h2 .ct{color:var(--mut);font-size:13px;font-weight:600;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.picks .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
@media(max-width:560px){.grid,.picks .grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .12s,border-color .12s}
.card:hover{border-color:var(--gold)}
.card.press{transform:scale(.98)}
.card .img{aspect-ratio:1;background:#ece9e0;display:flex;align-items:center;justify-content:center}
.card img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.card .meta{padding:9px 11px 11px}
.card .nm{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card .pr{color:var(--gold2);font-weight:800;margin-top:4px;font-size:15px}
.empty,.loading{color:var(--mut);padding:30px 0;text-align:center}
.sk{background:linear-gradient(90deg,#252a1e,#2f3526,#252a1e);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px;aspect-ratio:.78}
@keyframes sk{to{background-position:-200% 0}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;background:#1b1f15;border:1px solid var(--line);color:var(--ink);transition:transform .25s ease;display:flex;flex-direction:column}
#picker{visibility:hidden;left:50%;bottom:0;width:min(560px,100%);max-height:92vh;border-radius:18px 18px 0 0;transform:translate(-50%,105%)}
#picker.on{visibility:visible;transform:translate(-50%,0)}
@media(min-width:760px){#picker{bottom:auto;top:50%;border-radius:18px;transform:translate(-50%,-40%);opacity:0;pointer-events:none}#picker.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
#drawer{top:0;right:0;height:100%;width:min(420px,100%);transform:translateX(105%)}
#drawer.on{transform:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh-head h3{margin:0;font-size:17px;flex:1}
.x{background:none;border:1px solid var(--line);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer}
.sh-body{overflow-y:auto;padding:14px 16px;flex:1;overscroll-behavior:contain}
.pk-top{display:flex;gap:14px}
.pk-top img{width:120px;height:120px;object-fit:contain;background:#ece9e0;border-radius:12px;flex:none}
.pk-top .nm{font-weight:800;font-size:16px}
.pk-top .pr{color:var(--gold2);font-weight:800;font-size:20px;margin-top:6px}
.lbl{margin:16px 0 8px;font-size:13px;color:var(--mut);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-width:48px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
.opt.sel{border-color:var(--gold);background:var(--gold);color:#1a1a10}
.opt:disabled{opacity:.3;text-decoration:line-through;cursor:default}
.sh-foot{padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.btn{width:100%;background:var(--gold);color:#1a1a10;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:13px;color:var(--mut);margin:0 0 10px;text-align:center}
.note b{color:var(--gold2)}
.line{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line img{width:64px;height:64px;object-fit:contain;background:#ece9e0;border-radius:10px;flex:none}
.line .i{flex:1;min-width:0}
.line .t{font-weight:700;font-size:14px}
.line .v{color:var(--mut);font-size:13px}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;cursor:pointer}
.line .p{font-weight:800;color:var(--gold2);white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-size:15px;margin:4px 0}
.tot.big{font-size:18px;font-weight:800}
.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);opacity:0;background:#0d0f09;border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:12px;z-index:60;transition:.25s;font-weight:700;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 16px 40px;border-top:1px solid var(--line);background:url(img/banner-camo.webp) center/cover;background-blend-mode:multiply;background-color:#2a2d22}
footer b{color:var(--gold2);letter-spacing:.14em}

/* ---- product page ---- */
#pdp{display:none;max-width:1180px;margin:0 auto;padding:10px 14px 110px}
body.pdp-on #pdp{display:block}
body.pdp-on .hero,body.pdp-on main{display:none}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;margin:6px 0 12px}
.pd{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.pd>*{min-width:0}
@media(min-width:860px){.pd{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px}.pd .gal{position:sticky;top:76px;align-self:start}}
.gal .main{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;background:#ece9e0;scrollbar-width:none;overscroll-behavior-x:contain}
.gal .main::-webkit-scrollbar{display:none}
.gal .main img{flex:none;width:100%;aspect-ratio:1;object-fit:contain;scroll-snap-align:center;-webkit-user-drag:none;user-select:none}
.gal .dots{display:flex;justify-content:center;gap:6px;margin:8px 0 0}
.gal .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.gal .dots i.on{background:var(--gold)}
.gal .thumbs{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.gal .thumbs::-webkit-scrollbar{display:none}
.gal .thumbs button{flex:none;width:64px;height:64px;padding:0;border-radius:10px;border:2px solid transparent;background:#ece9e0;cursor:pointer;overflow:hidden}
.gal .thumbs button.sel{border-color:var(--gold)}
.gal .thumbs img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.pd h1{margin:0;font-size:clamp(22px,4vw,32px);line-height:1.15}
.pd .price{color:var(--gold2);font-weight:800;font-size:26px;margin:8px 0 2px}
.pd .shipn{color:var(--mut);font-size:13px}
.pd .addwrap{margin-top:18px}
@media(max-width:859px){.pd .addwrap{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(18,20,13,.96);border-top:1px solid var(--line)}}
.pd h3{margin:26px 0 10px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.pd h3::before{content:"";width:5px;height:18px;background:var(--gold);border-radius:3px}
.desc{color:#e3dfcf;font-size:15px;line-height:1.55}
.desc p{margin:0 0 10px}.desc ul{margin:0 0 10px;padding-left:20px}.desc li{margin:3px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.tabs button.sel{background:var(--gold);border-color:var(--gold);color:#1a1a10}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.sz{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
table.sz th,table.sz td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--line)}
table.sz tr:last-child td{border-bottom:0}
table.sz thead th{color:var(--gold2);background:#1b1f15}
table.sz th:first-child,table.sz td:first-child{text-align:left;position:sticky;left:0;background:#1b1f15;font-weight:700}
table.sz td.hl,table.sz th.hl{background:rgba(212,167,44,.16)}
.sznote{color:var(--mut);font-size:12.5px;margin-top:6px}

.thanks{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.65)}
.thanks .box{max-width:440px;width:100%;background:#1b1f15;border:1px solid var(--gold);border-radius:18px;padding:24px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.thanks h2{margin:0 0 8px;color:var(--gold2);letter-spacing:.06em}
.thanks p{margin:0 0 16px;color:#e3dfcf;line-height:1.5}
</style>
</head>
<body>
<header class="top">
  <img src="img/banner-logo.webp" alt="">
  <div class="brand">LIFT WITHIN<small>PHILIPPIANS 4:13</small></div>
  <button class="cartbtn" id="cartBtn" type="button" aria-label="Open cart">Cart<span class="n" id="cartN">0</span></button>
</header>
<div class="hero"><div class="inner">
  <img class="logo" src="img/banner-camo.webp" alt="Lift Within sheep logo on four camo patterns" width="780" height="720">
  <div class="copy">
    <h1>LIFT WITHIN</h1>
    <div class="verse">PHILIPPIANS 4:13</div>
    <p>I can do all things through Christ who strengthens me. Camo and Signature gear built to train in.</p>
    <span class="ship">FREE shipping on orders $120+</span>
  </div>
</div></div>
<main>
  <nav class="jump" id="jump"></nav>
  <div id="sections"><div class="grid" style="margin-top:20px"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>
</main>
<div id="pdp"></div>
<footer><b>LIFT WITHIN</b><br>Philippians 4:13 · Printed on demand by Printful · <a href="/">Paige Games</a></footer>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="picker" role="dialog" aria-modal="true" aria-label="Choose options">
  <div class="sh-head"><h3>Choose size and color</h3><button class="x" type="button" data-close>&times;</button></div>
  <div class="sh-body" id="pkBody"></div>
  <div class="sh-foot"><button class="btn" id="addBtn" type="button">Add to cart</button></div>
</div>
<div class="sheet" id="drawer" role="dialog" aria-modal="true" aria-label="Cart">
  <div class="sh-head"><h3>Your cart</h3><button class="x" type="button" data-close>&times;</button></div>
  <div class="sh-body" id="cartBody"></div>
  <div class="sh-foot" id="cartFoot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== Editable config =====
const CONFIG = {
  api: 'https://kjdubkeowcyuoazvpoyt.supabase.co/functions/v1',
  // "Our Picks": shown first, in exactly this order (Printful sync product ids).
  picks: [
    488320813, // Timber Cotton Sweats
    488394939, // LW Signature Unisex mesh shorts
    488403405, // LW Fine Jersey T-Shirt
    488192599, // Duck Bark Unisex Athletic Shorts 6"
  ],
  collections: [
    { id: 'camo', title: 'Camo', match: ['timber', 'duck bark', 'quack'] },
    { id: 'signature', title: 'Signature', match: ['signature'] },
    { id: 'disciple', title: 'Disciple', match: ['disciple'] },
  ],
  // First matching category wins: sweatshirt before sweats; hoodie before shirts.
  categories: [
    { id: 'sweatshirts', title: 'Sweatshirts', match: ['sweatshirt'] },
    { id: 'pants', title: 'Pants', match: ['pants', 'joggers', 'sweats'] },
    { id: 'shorts', title: 'Shorts', match: ['shorts'] },
    { id: 'jackets', title: 'Jackets', match: ['hoodie', 'jacket'] },
    { id: 'shirts', title: 'Shirts', match: ['t-shirt', 'tee', 'jersey', 'shirt'] },
  ],
  categoryOrder: ['pants', 'shorts', 'sweatshirts', 'shirts', 'jackets'],
};
// ==========================

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => '$' + Number(n).toFixed(2).replace(/\.00$/, '');
let PRODUCTS = [], BY_ID = {}, VARIANT = {};

// ---- tap-only activation: drags/scrolls never trigger ----
function onTap(el, fn) {
  let sx = 0, sy = 0, st = 0, moved = true, id = null;
  el.addEventListener('pointerdown', (e) => { if (e.button > 0) return; id = e.pointerId; sx = e.clientX; sy = e.clientY; st = Date.now(); moved = false; });
  el.addEventListener('pointermove', (e) => { if (e.pointerId === id && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) moved = true; });
  el.addEventListener('pointercancel', () => { moved = true; });
  addEventListener('scroll', () => { moved = true; }, { passive: true, capture: true });
  el.addEventListener('pointerup', (e) => {
    if (e.pointerId !== id) return; id = null;
    if (!moved && Date.now() - st < 600 && Math.hypot(e.clientX - sx, e.clientY - sy) <= 8) fn(e);
    moved = true;
  });
  el.addEventListener('click', (e) => { if (e.detail === 0) fn(e); }); // keyboard (Enter/Space)
}
// delegated taps: data-act on any descendant
function tapRoot(root, map) { onTap(root, (e) => { const t = e.target.closest('[data-act]'); if (t && root.contains(t) && !t.disabled) map[t.dataset.act]?.(t, e); }); }

function catOf(name) { const n = name.toLowerCase(); return CONFIG.categories.find((c) => c.match.some((m) => n.includes(m)))?.id || null; }
function inColl(name, c) { const n = name.toLowerCase(); return c.match.some((m) => n.includes(m)); }
const byPrice = (a, b) => (a.min_price ?? 1e9) - (b.min_price ?? 1e9);
function cardImg(p) { return p.variants.find((v) => v.image)?.image || p.thumbnail; }
function card(p) {
  return `<div class="card" role="button" tabindex="0" data-act="open" data-id="${p.id}"><div class="img"><img loading="lazy" src="${esc(cardImg(p))}" alt="${esc(p.name)}"></div><div class="meta"><div class="nm">${esc(p.name)}</div><div class="pr">from ${money(p.min_price)}</div></div></div>`;
}

function render() {
  const secs = [];
  const picks = CONFIG.picks.map((id) => BY_ID[id]).filter(Boolean);
  if (picks.length) secs.push({ id: 'picks', title: 'Our Picks', items: picks, cls: 'picks' });
  for (const c of CONFIG.collections) secs.push({ id: c.id, title: c.title + ' Collection', items: PRODUCTS.filter((p) => inColl(p.name, c)).sort(byPrice) });
  for (const id of CONFIG.categoryOrder) { const c = CONFIG.categories.find((x) => x.id === id); secs.push({ id, title: c.title, items: PRODUCTS.filter((p) => catOf(p.name) === id).sort(byPrice) }); }
  const shown = secs.filter((s) => s.items.length);
  $('#jump').innerHTML = shown.map((s) => `<a href="#${s.id}">${esc(s.title.replace(' Collection', ''))}</a>`).join('');
  $('#sections').innerHTML = shown.map((s) => `<section id="${s.id}" class="${s.cls || ''}"><h2>${esc(s.title)} <span class="ct">${s.items.length}</span></h2><div class="grid">${s.items.map(card).join('')}</div></section>`).join('') || '<p class="empty">No products yet.</p>';
}

// ---- picker ----
let cur = null, selSize = null, selColor = null;
const SIZE_ORDER = ['XXS', '2XS', 'XS', 'S', 'M', 'L', 'XL', '2XL', 'XXL', '3XL', '4XL', '5XL', '6XL'];
const sizeRank = (s) => { const i = SIZE_ORDER.indexOf(s.toUpperCase()); return i < 0 ? 99 : i; };
function openPicker(id) {
  cur = BY_ID[id]; if (!cur) return;
  const colors = [...new Set(cur.variants.map((v) => v.color).filter(Boolean))];
  selColor = colors.length === 1 ? colors[0] : (colors[0] || null);
  const sizes = [...new Set(cur.variants.map((v) => v.size).filter(Boolean))];
  selSize = sizes.length === 1 ? sizes[0] : null;
  drawPicker(); show('#picker');
}
function curVariant() { return cur.variants.find((v) => (v.color || null) === (selColor || null) && (v.size || null) === (selSize || null)) || (!cur.variants.some((v) => v.size) && cur.variants.find((v) => (v.color || null) === selColor)); }
function drawPicker() {
  const colors = [...new Set(cur.variants.map((v) => v.color).filter(Boolean))];
  const sizes = [...new Set(cur.variants.map((v) => v.size).filter(Boolean))].sort((a, b) => sizeRank(a) - sizeRank(b));
  const avail = (s) => cur.variants.some((v) => v.size === s && (!selColor || v.color === selColor) && v.available !== false);
  const v = curVariant();
  const img = v?.image || cur.variants.find((x) => x.color === selColor && x.image)?.image || cardImg(cur);
  $('#pkBody').innerHTML = `<div class="pk-top"><img src="${esc(img)}" alt=""><div><div class="nm">${esc(cur.name)}</div><div class="pr">${v ? money(v.price) : 'from ' + money(cur.min_price)}</div></div></div>
    ${colors.length > 1 ? `<div class="lbl">Color: ${esc(selColor || '')}</div><div class="opts">${colors.map((c) => `<button type="button" class="opt ${c === selColor ? 'sel' : ''}" data-act="color" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : colors.length ? `<div class="lbl">Color: ${esc(colors[0])}</div>` : ''}
    ${sizes.length ? `<div class="lbl">Size</div><div class="opts">${sizes.map((s) => `<button type="button" class="opt ${s === selSize ? 'sel' : ''}" data-act="size" data-v="${esc(s)}" ${avail(s) ? '' : 'disabled'}>${esc(s)}</button>`).join('')}</div>` : ''}`;
  const b = $('#addBtn'); b.disabled = !v || v.available === false; b.textContent = v ? `Add to cart · ${money(v.price)}` : 'Choose a size';
}

// ---- cart (localStorage) ----
const KEY = 'liftwithin_cart_v1';
let cart = []; try { cart = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { cart = []; }
const save = () => { localStorage.setItem(KEY, JSON.stringify(cart)); drawCart(); };
const qtyTotal = () => cart.reduce((a, i) => a + i.qty, 0);
function addToCart(v) {
  const ex = cart.find((i) => i.id === v.id);
  if (ex) ex.qty = Math.min(10, ex.qty + 1);
  else cart.push({ id: v.id, qty: 1, name: cur.name, size: v.size, color: v.color, price: v.price, image: v.image || cardImg(cur) });
  save(); toast('Added to cart');
}
const FREE_OVER = 120;
const shipFor = (n, sub) => (n === 0 || Math.round(sub * 100) >= FREE_OVER * 100 ? 0 : 4 + 2 * (n - 1)); // mirrors liftwithin-checkout (server is authoritative)
function drawCart() {
  // refresh display price/name from live catalog when loaded
  for (const i of cart) { const v = VARIANT[i.id]; if (v) { i.price = v.price; } }
  const n = qtyTotal(); $('#cartN').textContent = n;
  const sub = cart.reduce((a, i) => a + i.qty * parseFloat(i.price || 0), 0);
  const ship = shipFor(n, sub);
  $('#cartBody').innerHTML = cart.length ? cart.map((i) => `<div class="line"><img src="${esc(i.image || '')}" alt=""><div class="i"><div class="t">${esc(i.name)}</div><div class="v">${esc([i.color, i.size].filter(Boolean).join(' / '))}</div>
      <div class="qty"><button type="button" data-act="dec" data-id="${i.id}" aria-label="Less">&minus;</button><b>${i.qty}</b><button type="button" data-act="inc" data-id="${i.id}" aria-label="More">+</button></div></div><div class="p">${money(i.qty * parseFloat(i.price))}</div></div>`).join('')
    : '<p class="empty">Your cart is empty.</p>';
  $('#cartFoot').innerHTML = `<p class="note">${n === 0 ? 'Shipping: <b>$4</b> + <b>$2</b> per extra item, <b>FREE</b> on orders $120+.' : ship ? `Add <b>${money(FREE_OVER - sub)}</b> more for <b>FREE shipping</b>.` : '<b>FREE shipping</b> unlocked ($120+).'}</p>
    ${cart.length ? `<div class="tot"><span>Subtotal</span><span>${money(sub)}</span></div><div class="tot"><span>Shipping (US)</span><span>${ship ? money(ship) : 'FREE'}</span></div><div class="tot big"><span>Total</span><span>${money(sub + ship)}</span></div>` : ''}
    <button class="btn" type="button" data-act="checkout" ${cart.length ? '' : 'disabled'} style="margin-top:10px">Checkout</button>`;
}
async function checkout(btn) {
  btn.disabled = true; btn.textContent = 'Opening secure checkout…';
  try {
    const r = await fetch(CONFIG.api + '/liftwithin-checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: cart.map((i) => ({ sync_variant_id: i.id, qty: i.qty })), return_url: location.origin + location.pathname }) });
    const j = await r.json(); if (!r.ok || !j.url) throw new Error(j.error || 'Checkout failed');
    location.href = j.url;
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'Checkout'; }
}

// ---- sheets ----
function show(sel) { $(sel).classList.add('on'); $('#scrim').classList.add('on'); document.body.style.overflow = 'hidden'; }
function hideAll() { document.querySelectorAll('.sheet.on').forEach((s) => s.classList.remove('on')); $('#scrim').classList.remove('on'); document.body.style.overflow = ''; }
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }

// press feedback only, never activation
document.addEventListener('pointerdown', (e) => { const c = e.target.closest('.card'); if (c) { c.classList.add('press'); const off = () => { c.classList.remove('press'); removeEventListener('pointerup', off); removeEventListener('pointercancel', off); removeEventListener('scroll', off, true); }; addEventListener('pointerup', off); addEventListener('pointercancel', off); addEventListener('scroll', off, true); } });

tapRoot($('#sections'), { open: (t) => goProduct(t.dataset.id) });
$('#sections').addEventListener('keydown', (e) => { const c = e.target.closest('.card'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); goProduct(c.dataset.id); } });
tapRoot($('#pkBody'), { color: (t) => { selColor = t.dataset.v; if (selSize && !cur.variants.some((v) => v.size === selSize && v.color === selColor)) selSize = null; drawPicker(); }, size: (t) => { selSize = t.dataset.v; drawPicker(); } });
onTap($('#addBtn'), () => { const v = curVariant(); if (v && !$('#addBtn').disabled) { addToCart(v); hideAll(); } });
tapRoot($('#drawer'), {
  inc: (t) => { const i = cart.find((x) => x.id == t.dataset.id); if (i) { i.qty = Math.min(10, i.qty + 1); save(); } },
  dec: (t) => { const i = cart.find((x) => x.id == t.dataset.id); if (i) { i.qty--; if (i.qty <= 0) cart = cart.filter((x) => x !== i); save(); } },
  checkout: (t) => checkout(t),
});
document.querySelectorAll('[data-close]').forEach((b) => onTap(b, hideAll));
onTap($('#scrim'), hideAll);
onTap($('#cartBtn'), () => { drawCart(); show('#drawer'); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') hideAll(); });
// ---- product page (?p=<sync product id>) ----
const DETAIL = {}; let pdTab = null, listY = 0;
function goProduct(id) { listY = scrollY; history.pushState({ p: id }, '', location.pathname + '?p=' + id); route(); }
function goList() { if (history.state && history.state.p) history.back(); else { history.replaceState(null, '', location.pathname); route(); } }
function route() {
  const id = new URLSearchParams(location.search).get('p');
  hideAll();
  if (!id) { const wasPdp = document.body.classList.contains('pdp-on'); document.body.classList.remove('pdp-on'); document.title = 'Lift Within Shop | Paige Games'; if (wasPdp) requestAnimationFrame(() => scrollTo(0, listY)); return; } // section #hash links fire popstate too; only restore list scroll when leaving a product page
  document.body.classList.add('pdp-on'); scrollTo(0, 0);
  const quick = BY_ID[id];
  if (DETAIL[id]) return openProduct(DETAIL[id]);
  if (quick) openProduct({ ...quick, description: null, size_tables: null });
  else $('#pdp').innerHTML = '<button class="back" type="button" data-act="back">&larr; All products</button><p class="loading">Loading…</p>';
  fetch(CONFIG.api + '/liftwithin-product?id=' + encodeURIComponent(id)).then((r) => r.ok ? r.json() : Promise.reject(r.status)).then((d) => {
    DETAIL[id] = d; for (const v of d.variants) VARIANT[v.id] = v;
    if (new URLSearchParams(location.search).get('p') === id) openProduct(d, true);
  }).catch(() => { if (!quick) $('#pdp').innerHTML = '<button class="back" type="button" data-act="back">&larr; All products</button><p class="empty">Product not found.</p>'; });
}
function openProduct(p, keepSel) {
  const same = cur && cur.id === p.id;
  cur = p; document.title = p.name + ' | Lift Within';
  if (!(keepSel && same)) {
    const colors = [...new Set(p.variants.map((v) => v.color).filter(Boolean))];
    selColor = colors[0] || null;
    const sizes = [...new Set(p.variants.map((v) => v.size).filter(Boolean))];
    selSize = sizes.length === 1 ? sizes[0] : null;
  }
  if (p.size_tables && !p.size_tables.some((t) => t.type === pdTab)) pdTab = (p.size_tables.find((t) => t.type === 'product_measure') || p.size_tables[0] || {}).type || null;
  drawProduct();
}
let EXTRA = {}; // Gary's extra mockups: printful product id -> [{src, color?}], shown after Printful's
fetch('/liftwithin/extra-mockups.json').then((r) => r.ok ? r.json() : {}).then((d) => { EXTRA = d || {}; if (cur && document.body.classList.contains('pdp-on')) drawProduct(); }).catch(() => {});
function galleryImgs() {
  const vs = cur.variants.filter((v) => !selColor || v.color === selColor);
  const out = []; const v = curVariant();
  for (const x of [v, ...vs]) if (x) for (const u of (x.images || [x.image])) if (u && !out.includes(u)) out.push(u);
  if (!out.length) out.push(cardImg(cur));
  for (const e of EXTRA[cur.id] || []) if (!e.color || !selColor || e.color === selColor) { const u = '/liftwithin/' + e.src; if (!out.includes(u)) out.push(u); };
  return out;
}
const stripTags = (h) => { const d = document.createElement('div'); d.innerHTML = String(h || '').replace(/<\/(p|h\d|li|div)>|<br\s*\/?>/gi, '\n'); return d.textContent.replace(/\n{3,}/g, '\n\n').trim(); };
function descHtml(t) {
  const out = []; let ul = [];
  const flush = () => { if (ul.length) out.push('<ul>' + ul.map((x) => `<li>${esc(x)}</li>`).join('') + '</ul>'); ul = []; };
  for (const raw of String(t || '').split(/\r?\n/)) {
    const l = raw.trim(); if (!l) { flush(); continue; }
    const m = l.match(/^[·•\-*–]\s*(.*)$/);
    if (m) ul.push(m[1]); else { flush(); out.push(`<p>${esc(l)}</p>`); }
  }
  flush(); return out.join('');
}
const TAB_NAME = { product_measure: 'Product measurements', measure_yourself: 'Measure yourself', international: 'International' };
function sizeTableHtml(t) {
  const sizes = []; for (const m of t.measurements) for (const v of m.values) if (!sizes.includes(v.size)) sizes.push(v.size);
  sizes.sort((a, b) => sizeRank(a) - sizeRank(b));
  const cell = (m, s) => { const v = m.values.find((x) => x.size === s); if (!v) return '–'; return esc(v.value ?? (v.min_value != null ? v.min_value + '–' + v.max_value : '–')); };
  const hl = (s) => (s === selSize ? ' class="hl"' : '');
  return `<div class="tblw"><table class="sz"><thead><tr><th>Size (${esc(t.unit || 'in')})</th>${sizes.map((s) => `<th${hl(s)}>${esc(s)}</th>`).join('')}</tr></thead><tbody>${t.measurements.map((m) => `<tr><td>${esc(m.type_label)}</td>${sizes.map((s) => `<td${hl(s)}>${cell(m, s)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function drawProduct() {
  const p = cur;
  const colors = [...new Set(p.variants.map((v) => v.color).filter(Boolean))];
  const sizes = [...new Set(p.variants.map((v) => v.size).filter(Boolean))].sort((a, b) => sizeRank(a) - sizeRank(b));
  const avail = (s) => p.variants.some((v) => v.size === s && (!selColor || v.color === selColor) && v.available !== false);
  const v = curVariant(); const imgs = galleryImgs();
  const tables = p.size_tables || []; const tab = tables.find((t) => t.type === pdTab) || tables[0];
  $('#pdp').innerHTML = `<button class="back" type="button" data-act="back">&larr; All products</button>
  <div class="pd">
    <div class="gal">
      <div class="main" id="galMain">${imgs.map((u, i) => `<img src="${esc(u)}" alt="${esc(p.name)} image ${i + 1}" ${i ? 'loading="lazy"' : ''} draggable="false">`).join('')}</div>
      ${imgs.length > 1 ? `<div class="dots" id="galDots">${imgs.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div><div class="thumbs" id="galThumbs">${imgs.map((u, i) => `<button type="button" class="${i ? '' : 'sel'}" data-act="img" data-i="${i}" aria-label="Image ${i + 1}"><img src="${esc(u)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
    </div>
    <div class="info">
      <h1>${esc(p.name)}</h1>
      <div class="price">${v ? money(v.price) : 'from ' + money(p.min_price)}</div>
      <div class="shipn">FREE shipping on orders $120+ · otherwise $4 + $2 per extra item</div>
      ${colors.length > 1 ? `<div class="lbl">Color: ${esc(selColor || '')}</div><div class="opts">${colors.map((c) => `<button type="button" class="opt ${c === selColor ? 'sel' : ''}" data-act="color" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : colors.length ? `<div class="lbl">Color: ${esc(colors[0])}</div>` : ''}
      ${sizes.length ? `<div class="lbl">Size${selSize ? ': ' + esc(selSize) : ''}</div><div class="opts">${sizes.map((s) => `<button type="button" class="opt ${s === selSize ? 'sel' : ''}" data-act="size" data-v="${esc(s)}" ${avail(s) ? '' : 'disabled'}>${esc(s)}</button>`).join('')}</div>` : ''}
      <div class="addwrap"><button class="btn" type="button" data-act="add" ${!v || v.available === false ? 'disabled' : ''}>${v ? (v.available === false ? 'Out of stock' : `Add to cart · ${money(v.price)}`) : 'Choose a size'}</button></div>
      <h3>Description</h3>
      <div class="desc">${p.description == null ? '<p class="loading" style="padding:6px 0;text-align:left">Loading…</p>' : descHtml(p.description) || '<p>—</p>'}</div>
      ${p.size_tables == null ? '<h3>Size chart</h3><p class="loading" style="padding:6px 0;text-align:left">Loading…</p>' : tab ? `<h3>Size chart</h3>
        ${tables.length > 1 ? `<div class="tabs">${tables.map((t) => `<button type="button" class="${t === tab ? 'sel' : ''}" data-act="tab" data-v="${esc(t.type)}">${esc(TAB_NAME[t.type] || t.type)}</button>`).join('')}</div>` : ''}
        ${sizeTableHtml(tab)}<div class="sznote">${esc(stripTags(tab.description)).replace(/\n+/g, ' ')}</div>` : ''}
    </div>
  </div>`;
  const gm = $('#galMain');
  if (gm && imgs.length > 1) gm.addEventListener('scroll', () => {
    const i = Math.round(gm.scrollLeft / gm.clientWidth);
    document.querySelectorAll('#galDots i').forEach((d, k) => d.classList.toggle('on', k === i));
    document.querySelectorAll('#galThumbs button').forEach((d, k) => d.classList.toggle('sel', k === i));
  }, { passive: true });
}
tapRoot($('#pdp'), {
  back: () => goList(),
  color: (t) => { selColor = t.dataset.v; if (selSize && !cur.variants.some((v) => v.size === selSize && v.color === selColor)) selSize = null; drawProduct(); },
  size: (t) => { selSize = t.dataset.v; const y = scrollY; drawProduct(); scrollTo(0, y); },
  tab: (t) => { pdTab = t.dataset.v; drawProduct(); },
  img: (t) => { const gm = $('#galMain'); gm.scrollTo({ left: gm.clientWidth * +t.dataset.i, behavior: 'smooth' }); },
  add: () => { const v = curVariant(); if (v && v.available !== false) addToCart(v); },
});
addEventListener('popstate', route);


const qs = new URLSearchParams(location.search);
if (qs.get('checkout') === 'success') {
  cart = []; save(); history.replaceState(null, '', location.pathname);
  // shown only after a completed checkout
  const t = document.createElement('div'); t.className = 'thanks'; t.setAttribute('role', 'dialog'); t.setAttribute('aria-modal', 'true');
  t.innerHTML = '<div class="box"><h2>Thanks for your order!</h2><p>Please allow 2-4 days for us to process your order before it ships.</p><button class="btn" type="button">Keep shopping</button></div>';
  document.body.appendChild(t); onTap(t.querySelector('button'), () => t.remove());
}
else if (qs.get('checkout') === 'cancel') { setTimeout(() => toast('Checkout canceled. Your cart is saved.'), 300); history.replaceState(null, '', location.pathname); }

drawCart();
if (qs.get('p')) route();
fetch(CONFIG.api + '/liftwithin-products').then((r) => r.json()).then((d) => {
  PRODUCTS = (d.products || []).filter((p) => p.min_price != null);
  BY_ID = Object.fromEntries(PRODUCTS.map((p) => [p.id, p]));
  for (const p of PRODUCTS) for (const v of p.variants) VARIANT[v.id] = v;
  cart = cart.filter((i) => VARIANT[i.id]); // drop items no longer sold
  render(); drawCart(); if (cur && document.body.classList.contains('pdp-on')) drawProduct();
}).catch(() => { $('#sections').innerHTML = '<p class="empty">Could not load products. Please refresh.</p>'; });
</script>
</body>
</html>
