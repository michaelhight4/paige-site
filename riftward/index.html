<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b1a">
<title>Riftward is coming back soon | Paige Industries</title>
<meta name="description" content="Riftward is getting a full overhaul. Coming back soon. Your progress and saves are safe.">
<link rel="canonical" href="https://paigegames.net/riftward/">
<link rel="manifest" href="/riftward/manifest.webmanifest">
<link rel="icon" href="/riftward/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/riftward/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/riftward/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/riftward/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/riftward/icons/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Paige Industries">
<meta property="og:title" content="Riftward is coming back soon">
<meta property="og:description" content="Riftward is getting a full overhaul. Your progress and saves are safe.">
<meta property="og:url" content="https://paigegames.net/riftward/">
<style>
:root{--bg0:#05060d;--bg1:#0c0f2a;--ink:#eef0ff;--mut:#b5bbdb;--line:rgba(140,160,255,.18);--glass:rgba(18,22,52,.62);--rift:#ffb648;--lime:#d8ff3a;--kil:#4fe3c1;--sky:#7aa2ff;--life:#ff5fa8;--disp:"Bahnschrift","Arial Black","Segoe UI",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--ink);font:16px/1.55 var(--body);background:radial-gradient(1200px 700px at 80% -10%,#2a1f7a 0,transparent 60%),radial-gradient(900px 600px at -10% 30%,#0f2f6b 0,transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg0) 70%);background-attachment:fixed}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:6px}
header{border-bottom:1px solid var(--line);background:rgba(6,8,22,.82)}
.bar{max-width:72rem;margin:0 auto;padding:12px 18px}
.logo{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font:800 19px var(--disp);letter-spacing:.02em}
.logo b{color:var(--lime);font-weight:800}
.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--life),var(--sky));color:#0a0b1a;font-weight:900;box-shadow:0 0 18px rgba(122,162,255,.5)}
main{flex:1;display:grid;place-items:center;padding:32px 18px}
.card{max-width:36rem;width:100%;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:36px 24px;backdrop-filter:blur(10px)}
.eyebrow{margin:0 0 8px;font:800 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--rift)}
h1{font:900 clamp(30px,7vw,48px)/1.1 var(--disp);margin:0 0 12px;letter-spacing:-.01em}
h1 span{background:linear-gradient(90deg,var(--lime),var(--kil) 50%,var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mut);font-size:1.1rem;margin:0 0 6px}
.safe{display:inline-block;margin:18px 0 24px;padding:8px 16px;border:1px solid var(--kil);border-radius:999px;color:var(--kil);font-weight:700;font-size:.95rem}
.btn{display:inline-block;background:linear-gradient(90deg,var(--lime),var(--kil));color:#0a0b1a;padding:12px 22px;border-radius:12px;font-weight:800;text-decoration:none}
footer{border-top:1px solid var(--line);color:var(--mut);padding:14px 18px;text-align:center;font-size:.9rem}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="/"><span class="mark" aria-hidden="true">P</span>Paige <b>Industries</b></a></div></header>
<main id="main">
<section class="card" aria-labelledby="t">
<p class="eyebrow">Riftward</p>
<h1 id="t"><span>Riftward is getting a full overhaul</span></h1>
<p class="lead">Coming back soon.</p>
<p class="safe">Your progress and saves are safe</p>
<p><a class="btn" href="/">Back to Paige Games home</a></p>
</section>
</main>
<footer>&copy; Paige Industries</footer>
</body>
</html>
